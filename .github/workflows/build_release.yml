name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'dev'
      create_release:
        description: 'Create GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Build for ARM64
        run: |
          xcodebuild -project ipatoolUI.xcodeproj \
            -scheme ipatoolUI \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath build/arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Build for x86_64
        run: |
          xcodebuild -project ipatoolUI.xcodeproj \
            -scheme ipatoolUI \
            -configuration Release \
            -arch x86_64 \
            -derivedDataPath build/x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Create Universal Binary
        run: |
          mkdir -p build/universal
          ARM64_APP="build/arm64/Build/Products/Release/ipatoolUI.app"
          X86_APP="build/x86_64/Build/Products/Release/ipatoolUI.app"
          UNIVERSAL_APP="build/universal/ipatoolUI.app"
          cp -R "$ARM64_APP" "$UNIVERSAL_APP"
          lipo -create \
            "$ARM64_APP/Contents/MacOS/ipatoolUI" \
            "$X86_APP/Contents/MacOS/ipatoolUI" \
            -output "$UNIVERSAL_APP/Contents/MacOS/ipatoolUI"
          lipo -info "$UNIVERSAL_APP/Contents/MacOS/ipatoolUI"

      - name: Create DMGs
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for ARCH in universal arm64 x86_64; do
            mkdir -p dmg_contents
            if [ "$ARCH" = "universal" ]; then
              cp -R build/universal/ipatoolUI.app dmg_contents/
            else
              cp -R "build/$ARCH/Build/Products/Release/ipatoolUI.app" dmg_contents/
            fi
            ln -s /Applications dmg_contents/Applications
            hdiutil create -volname "ipatoolUI" \
              -srcfolder dmg_contents \
              -ov -format UDZO \
              "ipatoolUI-${VERSION}-${ARCH}.dmg"
            rm -rf dmg_contents
          done

      - name: Generate checksums
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "## SHA256 Checksums" > checksums.txt
          echo >> checksums.txt
          shasum -a 256 ipatoolUI-${VERSION}-*.dmg >> checksums.txt
          cat checksums.txt

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipatoolUI-${{ steps.version.outputs.version }}-macos
          path: |
            *.dmg
            checksums.txt
          retention-days: 30

  build-windows:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore dependencies
        run: dotnet restore windows/ipatoolUI.Windows.csproj

      - name: Build Windows executable
        run: >-
          dotnet publish windows/ipatoolUI.Windows.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output windows/publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Package Windows app
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "windows/publish/*" `
            -DestinationPath "ipatoolUI-windows-${{ github.run_number }}.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipatoolUI-${{ github.run_number }}-windows
          path: ipatoolUI-windows-${{ github.run_number }}.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/checksums.txt
          body: |
            ## Downloads

            | File | Platform |
            |------|----------|
            | `ipatoolUI-${{ steps.version.outputs.version }}-universal.dmg` | macOS Universal |
            | `ipatoolUI-${{ steps.version.outputs.version }}-arm64.dmg` | macOS Apple Silicon |
            | `ipatoolUI-${{ steps.version.outputs.version }}-x86_64.dmg` | macOS Intel |
            | `ipatoolUI-windows-${{ github.run_number }}.zip` | Windows x64 |

            ## Requirements
            - macOS 13.0 or later for the native macOS app
            - Windows x64 for the Windows companion app
            - [ipatool](https://github.com/majd/ipatool) installed

          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
